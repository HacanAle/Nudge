name: Release

# Push a tag like v0.1.0 to build the Windows installer and attach it to a draft GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Nudge ${{ github.ref_name }}
          releaseBody: |
            Download `Nudge_*_x64-setup.exe` below and run it. No admin rights needed.

            The installer is not code-signed yet, so Windows SmartScreen may say "Windows protected your PC".
            Choose **More info → Run anyway**.
          releaseDraft: true
