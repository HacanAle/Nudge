[package]
name = "nudge"
version = "0.1.0"
description = "Reminders for Windows that wait for an answer"
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nudge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["time"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
tauri-plugin-single-instance = "2.0.0-rc.5"
base64 = "0.23.1"
tauri-plugin-global-shortcut = "2.0.0-rc.2"
tauri-plugin-autostart = "2.0.0-rc.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"
